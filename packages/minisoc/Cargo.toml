[package]
name = "minisoc"
version = "0.1.0"
edition = "2021"
description = "Personal local SOC: normalize, filter, triage and (optionally) LLM-enrich security alerts"
license = "MIT"

[[bin]]
name = "minisoc"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ipnet = "2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
